{% if site.comments.utterances.repo %}
  {% if page.translation_key %}
    {% capture utterances_issue_term %}blog-{{ page.translation_key }}{% endcapture %}
  {% else %}
    {% assign utterances_issue_term = page.url %}
  {% endif %}

  <script>
    (function () {
      var comments = document.getElementById("comments");
      if (!comments) return;

      var script = document.createElement("script");
      script.src = "https://utteranc.es/client.js";
      script.setAttribute("repo", {{ site.comments.utterances.repo | jsonify }});
      script.setAttribute("issue-term", {{ utterances_issue_term | strip | jsonify }});
      script.setAttribute("label", "blog comment");
      script.setAttribute("theme", "github-light");
      script.setAttribute("crossorigin", "anonymous");
      script.async = true;
      comments.appendChild(script);
    }());
  </script>
{% endif %}
