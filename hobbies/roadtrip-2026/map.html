const CAT = {
  "Start":"start","Destination":"dest","Waterfall":"waterfall",
  "National Park":"park","Trail / Park":"park","City":"city",
  "Lodging":"lodging","Lighthouse":"scenic","Coastal Lookout":"scenic",
  "Scenic Overlook":"scenic","Visitor Center":"scenic"
};
const CATLABEL = {start:"Start",dest:"Destination",waterfall:"Waterfall",park:"Park / Trail",city:"City / Town",lodging:"Lodging",scenic:"Scenic / Lookout"};
function cssvar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function catColor(c){return cssvar('--'+c);}

// ---- Map ----
const map = L.map('map',{scrollWheelZoom:true,zoomControl:true});

// Base layers — real geography (terrain relief + satellite imagery) plus clean street maps
const esriAttr='Tiles © Esri';
const terrain = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{attribution:esriAttr+' — World Topo',maxZoom:19});
const relief  = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}',{attribution:esriAttr+' — Shaded Relief',maxZoom:13});
const terrainGroup = L.layerGroup([relief, terrain]); // relief hillshade under topo lines/labels
const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:esriAttr+' — World Imagery',maxZoom:19});
const streets = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19});
const streetsDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19});
terrainGroup.addTo(map); // default: shows the actual mountains, rivers, and passes
L.control.layers(
  {"Terrain (relief)":terrainGroup,"Satellite":satellite,"Streets (light)":streets,"Streets (dark)":streetsDark},
  {}, {position:'topright',collapsed:false}
).addTo(map);
function setTiles(){}  // base layer now chosen via the layer control

// route line + markers (rebuildable so theme toggle recolors cleanly)
const line = DATA.route;
let layers=[];
function clearLayers(){layers.forEach(l=>map.removeLayer(l));layers=[];}
let routePoly;
function drawRoute(){
  clearLayers();
  const casing=L.polyline(line,{color:cssvar('--routecase'),weight:7,opacity:.9}).addTo(map);
  routePoly=L.polyline(line,{color:cssvar('--route'),weight:4,opacity:.95}).addTo(map);
  layers.push(casing,routePoly);
  DATA.stops.forEach((s,i)=>{
    const cat=CAT[s.type]||"city";
    const col=catColor(cat);
    const last=DATA.stops.length-1;
    const label=i===0?"S":(i===last?"F":String(i));
    const size=(i===0||i===last)?30:24;
    const icon=L.divIcon({className:'',html:`<div class="pin" style="width:${size}px;height:${size}px;background:${col}">${label}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});
    const m=L.marker([s.lat,s.lon],{icon,zIndexOffset:(i===0||i===last)?1000:0}).addTo(map);
    const ordinal=i===0?"Start":(i===last?"Finish":"Stop "+i);
    m.bindPopup(`<div class="pp"><div class="t">${ordinal} · ${s.type}</div><b>${s.name}</b></div>`);
    layers.push(m);
  });
}
drawRoute();
map.fitBounds(routePoly.getBounds().pad(0.08));

// ---- Panel ----
const T=DATA.totals, D=DATA.derived;
const tiles=[
  {v:T.miles.toLocaleString(undefined,{maximumFractionDigits:0}),s:"mi",l:"Total distance"},
  {v:T.drive_hm,l:"Drive time (moving)"},
  {v:DATA.stops.length,l:"Waypoints"},
  {v:D.waterfalls,l:"Waterfalls"},
];
document.getElementById('tiles').innerHTML = tiles.map(t=>
  `<div class="tile"><div class="v">${t.v}${t.s?`<small>${t.s}</small>`:''}</div><div class="l">${t.l}</div></div>`
).join('');

// legend (unique cats in route order)
function buildLegend(){
  const seen=[]; DATA.stops.forEach(s=>{const c=CAT[s.type]||"city"; if(!seen.includes(c))seen.push(c);});
  document.getElementById('legend').innerHTML = seen.map(c=>
    `<span class="lg"><span class="dot" style="background:${catColor(c)}"></span>${CATLABEL[c]}</span>`
  ).join('');
}
buildLegend();

// leg rows with distance bars
const maxmi=Math.max(...DATA.legs.map(l=>l.miles));
document.getElementById('rows').innerHTML = DATA.legs.map((l,i)=>{
  const from = i===0? "Mountain View" : l.from.split(",")[0];
  const to = l.to.split(",")[0];
  const w=(l.miles/maxmi*100).toFixed(1);
  return `<tr>
    <td><div class="legname"><span class="n">${i+1}</span>${from} <span class="arrow">→</span> ${to}</div></td>
    <td class="num">${l.hm}</td>
    <td class="num barcell"><span class="barbg" style="width:${w}%"></span><span class="barval">${l.miles.toFixed(0)} mi</span></td>
  </tr>`;
}).join('');

document.getElementById('foot').innerHTML =
  `Longest leg: <b>${D.longest_leg}</b> (${D.longest_mi.toFixed(0)} mi). `+
  `Distances &amp; drive times are real routing estimates (OSRM, driving profile); `+
  `moving time excludes stops, meals, hikes, and traffic. Total across all 18 legs: `+
  `${T.miles.toLocaleString(undefined,{maximumFractionDigits:0})} mi / ${T.drive_hm}.`;

// theme toggle
document.getElementById('tg').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  setTiles();
  drawRoute();
  buildLegend();
});
</script>
