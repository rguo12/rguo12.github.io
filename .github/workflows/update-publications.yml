name: Sync publications from Google Scholar

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # scholarly breaks with bibtexparser 2.x (ModuleNotFoundError: bibtexparser.bibdatabase)
      - run: pip install scholarly pyyaml "bibtexparser<2"
      # Adds papers that are on Scholar but missing from _bibliography/papers.bib
      # (never overwrites existing entries). Exits 0 even if Scholar blocks the request.
      - name: Add new papers
        continue-on-error: true
        run: python bin/sync_scholar_publications.py --max-new 15
      # OpenAlex is not rate-limited: fills in anything Scholar missed and tags each paper
      # as published or preprint (drives the two sections of the Publications page).
      - name: Complete and classify via OpenAlex
        run: python bin/sync_openalex_publications.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git diff --staged --quiet || (git commit -m "Sync publications from Google Scholar" && git push)
